# Backend eFlotte : PostgreSQL + API
#
#   cp .env.example .env      (une seule fois, puis adapter les valeurs)
#   docker compose up --build
#
#   API      → http://localhost:${API_PORT}/docs   (admin / admin123)
#   Postgres → localhost:${DB_PORT}
#
# Toutes les valeurs viennent du fichier .env (voir .env.example).
#
# Le front a son propre docker-compose.yml dans le dépôt eFlotte-Front.

name: eflotte

services:
  db:
    image: postgres:16-alpine
    container_name: eflotte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - eflotte-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    container_name: eflotte-api
    restart: unless-stopped
    command: >
      sh -c "python prestart.py &&
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8050
      --workers 1
      --timeout 300
      --graceful-timeout 30
      --keep-alive 5
      --access-logfile -
      --log-level info"
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8050}:8050"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  eflotte-db-data:
