# Backend eFlotte — PRODUCTION (EC2) : PostgreSQL + API + Caddy (HTTPS)
#
#   cp .env.example .env      (une fois, puis mots de passe forts + SITE_ADDRESS)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Puis dans eFlotte-Front : docker compose -f docker-compose.prod.yml up -d --build
#
# Seul Caddy est ouvert (80 / 443 par défaut, ou CADDY_HTTP_PORT / CADDY_HTTPS_PORT).
# La base n'écoute que sur 127.0.0.1 (accès par tunnel SSH), l'API n'est joignable
# que via Caddy sur /api.
#
# Serveur où 80 / 443 sont déjà pris par un autre proxy (nginx…) qui gère le HTTPS :
#   CADDY_HTTP_PORT=8050, CADDY_HTTPS_PORT=8443, SITE_ADDRESS=:80 dans .env,
#   puis ce proxy renvoie le domaine vers http://127.0.0.1:8050.

name: eflotte

services:
  db:
    image: postgres:16-alpine
    container_name: eflotte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - eflotte-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [eflotte]

  web:
    build: .
    container_name: eflotte-api
    restart: unless-stopped
    command: >
      sh -c "python prestart.py &&
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8050
      --workers 2
      --timeout 300
      --graceful-timeout 30
      --keep-alive 5
      --access-logfile -
      --log-level info"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
      CHAUFFEUR_MOT_DE_PASSE_INITIAL: ${CHAUFFEUR_MOT_DE_PASSE_INITIAL:-Camusat@2026}
      APP_URL: ${APP_URL:-}
      APP_MOBILE_URL: ${APP_MOBILE_URL:-}
      ORANGE_SMS_LOGIN: ${ORANGE_SMS_LOGIN:-}
      ORANGE_SMS_TOKEN: ${ORANGE_SMS_TOKEN:-}
      ORANGE_SMS_ACCESS_KEY: ${ORANGE_SMS_ACCESS_KEY:-}
      ORANGE_SMS_SIGNATURE: ${ORANGE_SMS_SIGNATURE:-CAMUSAT SN}
      ORANGE_SMS_BASE_URL: ${ORANGE_SMS_BASE_URL:-https://api.orangesmspro.sn:8443/api}
      ORANGE_SMS_VERIFY_SSL: ${ORANGE_SMS_VERIFY_SSL:-True}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [eflotte]

  caddy:
    image: caddy:2-alpine
    container_name: eflotte-caddy
    restart: unless-stopped
    ports:
      # Port de l'hôte : 80 par défaut ; 8050 si 80 est déjà utilisé sur le serveur
      - "${CADDY_HTTP_PORT:-80}:80"
      # HTTPS géré par Caddy seulement si SITE_ADDRESS est un nom de domaine
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      # ":80" = accès par l'IP en HTTP ; un nom de domaine = HTTPS automatique
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks: [eflotte]

volumes:
  eflotte-db-data:
  caddy-data:
  caddy-config:

networks:
  eflotte:
    name: eflotte
